# Render Blueprint. Secrets (sync: false) are entered in the service's Environment tab.
services:
  - type: web
    name: edgeboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Free data stack: football-data.org (fixtures + results) and The Odds API (prices)
      - key: FOOTBALL_PROVIDER
        value: football_data
      - key: ODDS_PROVIDER
        value: the_odds_api
      - key: FOOTBALL_DATA_TOKEN     # from football-data.org (free)
        sync: false
      - key: THE_ODDS_API_KEY        # from the-odds-api.com (free: 500 credits/month)
        sync: false
      - key: APP_PASSWORD            # password for the site (any username)
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: ODDS_CACHE_HOURS        # odds refreshed at most this often per league (each refresh = 2 credits)
        value: "24"
      - key: MAX_ANALYSED_FIXTURES   # no cap needed with football-data.org
        value: ""
      # Only used if FOOTBALL_PROVIDER is switched back to api_football (paid plan)
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_DAILY_CALL_LIMIT
        value: "100"
      - key: API_HISTORY_MATCHES
        value: "8"
